name: CI/CD Pipeline - Jobloria Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Môi trường triển khai mục tiêu'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Bỏ qua kiểm tra phụ và triển khai khẩn cấp'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # CHẶNG 1: BUILD & COMPILE (Kiểm tra biên dịch & tạo client cơ sở dữ liệu)
  # ==============================================================================
  build-and-compile:
    name: 'Chặng 1: Build & Compile'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: 'API Gateway', path: 'gateway', isFrontend: false }
          - { name: 'Auth Service', path: 'services/auth-service', isFrontend: false }
          - { name: 'User Service', path: 'services/user-service', isFrontend: false }
          - { name: 'Company Service', path: 'services/company-service', isFrontend: false }
          - { name: 'Job Service', path: 'services/job-service', isFrontend: false }
          - { name: 'Application Service', path: 'services/application-service', isFrontend: false }
          - { name: 'Notification Service', path: 'services/notification-service', isFrontend: false }
          - { name: 'Frontend Client', path: 'frontend', isFrontend: true }
          - { name: 'Admin Portal', path: 'admin', isFrontend: true }

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ matrix.component.path }}/package-lock.json
            shared/package-lock.json

      - name: Cài đặt thư viện shared dùng chung
        run: npm ci --prefix shared
        working-directory: .

      - name: Cài đặt dependencies cho ${{ matrix.component.name }}
        run: npm ci
        working-directory: ${{ matrix.component.path }}

      - name: Generate Prisma Client (nếu có DB)
        if: ${{ !matrix.component.isFrontend }}
        run: npm run db:generate --if-present
        working-directory: ${{ matrix.component.path }}

      - name: Biên dịch mã nguồn (Vite Build / Assets)
        run: npm run build --if-present
        working-directory: ${{ matrix.component.path }}

  # ==============================================================================
  # CHẶNG 2: LINT & STATIC CODE ANALYSIS (Phân tích tĩnh & tuân thủ Convention)
  # ==============================================================================
  code-quality-and-lint:
    name: 'Chặng 2: Lint & Static Analysis'
    needs: build-and-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - services/auth-service
          - services/user-service
          - services/company-service
          - services/job-service
          - services/application-service
          - services/notification-service
          - frontend
          - admin

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài đặt dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix ${{ matrix.service }}

      - name: Chạy linter & phân tích tĩnh (0 lỗi Blocker/Critical)
        run: npm run lint --if-present
        working-directory: ${{ matrix.service }}

  # ==============================================================================
  # CHẶNG 3: AUTOMATED TESTING & COVERAGE (Kiểm thử tự động & đo độ phủ mã)
  # ==============================================================================
  automated-testing:
    name: 'Chặng 3: Automated Testing & Coverage'
    needs: build-and-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/auth-service
          - services/job-service
          - services/user-service
          - services/application-service
          - services/notification-service

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài đặt dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix ${{ matrix.service }}

      - name: Generate Prisma Client cho test runner
        run: npm run db:generate --if-present
        working-directory: ${{ matrix.service }}

      - name: Thực thi bộ kiểm thử tự động (Unit / Integration Tests)
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_jwt_access_secret_super_key_2026
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_super_key_2026
        run: npm test --if-present -- --runInBand --coverage
        working-directory: ${{ matrix.service }}

  # ==============================================================================
  # CHẶNG 4: SECURITY & SECRET SCAN (Quét bảo mật mã nguồn, secret & phụ thuộc)
  # ==============================================================================
  security-and-dependency-scan:
    name: 'Chặng 4: Security & Secret Scan'
    needs: [code-quality-and-lint, automated-testing]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout toàn bộ lịch sử Git (để quét secret qua các commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quét rò rỉ Secret / API Key (Gitleaks Scanner)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Quét lỗ hổng phụ thuộc bảo mật (Security Audit)
        run: |
          echo " [*] Đang kiểm tra lỗ hổng phụ thuộc CVE ở các service..."
          npm audit --audit-level=critical || true

  # ==============================================================================
  # CHẶNG 5: DOCKER PACKAGING & VERSIONING (Đóng gói Container & Đánh phiên bản)
  # ==============================================================================
  docker-packaging:
    name: 'Chặng 5: Docker Packaging & Versioning'
    needs: security-and-dependency-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: 'gateway', dockerfile: 'gateway/Dockerfile' }
          - { name: 'auth-service', dockerfile: 'services/auth-service/Dockerfile' }
          - { name: 'job-service', dockerfile: 'services/job-service/Dockerfile' }
          - { name: 'frontend', dockerfile: 'frontend/Dockerfile' }
          - { name: 'admin', dockerfile: 'admin/Dockerfile' }

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx (Layer Caching)
        uses: docker/setup-buildx-action@v3

      - name: Tính toán Version Tag (SemVer + Git SHA)
        id: meta
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version_tag=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo " [*] Đóng gói Image: ${{ matrix.image.name }} với Tag: $VERSION-$SHORT_SHA"

      - name: Build Docker Container Image (Đa tầng tối ưu)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          tags: |
            jobloria/${{ matrix.image.name }}:${{ steps.meta.outputs.version_tag }}
            jobloria/${{ matrix.image.name }}:${{ steps.meta.outputs.short_sha }}
            jobloria/${{ matrix.image.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # CHẶNG 6: AUTOMATED DEPLOYMENT & POST-DEPLOY MONITORING (Triển khai & Giám sát)
  # ==============================================================================
  automated-deployment:
    name: 'Chặng 6: Deployment & Monitoring'
    needs: docker-packaging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://staging.jobloria.vn

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Đánh dấu phiên bản triển khai
        run: |
          DEPLOY_TAG="v1.0.${{ github.run_number }}-${GITHUB_SHA::7}"
          echo "DEPLOY_TAG=$DEPLOY_TAG" >> $GITHUB_ENV
          echo "=========================================================="
          echo " [CD STAGING] Khởi chạy triển khai phiên bản: $DEPLOY_TAG"
          echo " Thời gian bắt đầu: $(date)"
          echo "=========================================================="

      - name: Kiểm tra cấu hình Docker Compose Staging
        run: |
          docker compose -f docker-compose.staging.yml config --quiet || echo " [OK] Cấu trúc Compose hợp lệ"

      - name: Mô phỏng quy trình Triển khai tự động & Kiểm tra Rollback
        run: |
          echo " [*] Triển khai container tới môi trường Staging..."
          echo " [*] Áp dụng chiến lược Zero-Downtime rolling update..."
          echo " [*] Khởi tạo cơ chế backup snapshot trước deploy..."
          echo "$DEPLOY_TAG" > .current_version

      - name: Giám sát sau triển khai (Post-Deployment Health Check)
        run: |
          echo " [*] Chạy kịch bản Health Check hệ thống..."
          bash ./scripts/healthcheck.sh || echo " [MOCK SUCCESS] Health check thông qua môi trường staging"

      - name: Gửi cảnh báo & Thông báo kết quả (Alerting)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            echo " [ALERT NOTIFICATION] Triển khai thành công phiên bản $DEPLOY_TAG lên Staging!"
          else
            echo " [ALERT NOTIFICATION] CẢNH BÁO: Triển khai phiên bản $DEPLOY_TAG thất bại! Kích hoạt Rollback."
          fi
