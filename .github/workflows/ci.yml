name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  backend-checks:
    name: Check ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - services/auth-service
          - services/user-service
          - services/company-service
          - services/job-service
          - services/application-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ matrix.service }}/package-lock.json
            shared/package-lock.json

      - name: Install shared dependencies
        run: npm ci --prefix shared
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --if-present
        
      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: dev_jwt_access_secret_key_123456789
          JWT_REFRESH_SECRET: dev_jwt_refresh_secret_key_987654321
        run: npm test --if-present -- --runInBand

      - name: Build application
        run: npm run build --if-present
