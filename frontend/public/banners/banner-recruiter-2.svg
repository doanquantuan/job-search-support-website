<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient: Deep Slate Navy to Indigo/Purple -->
    <linearGradient id="recBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111c30" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <filter id="shadow2" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#recBg2)" />

  <!-- Ambient light glow -->
  <circle cx="1000" cy="210" r="200" fill="#818cf8" opacity="0.18" filter="blur(70px)" />
  <circle cx="200" cy="350" r="120" fill="#38bdf8" opacity="0.12" filter="blur(60px)" />

  <!-- Left Content -->
  <g transform="translate(70, 55)">
    <!-- Badge -->
    <g transform="translate(0, 0)">
      <rect width="330" height="34" rx="17" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#a855f7" />
      <text x="32" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#f5d0fe" letter-spacing="1">
        EMPLOYER BRANDING &amp; SĂN NHÂN TÀI
      </text>
    </g>

    <!-- Headline -->
    <text x="0" y="82" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Xây Dựng Thương Hiệu Tuyển Dụng
    </text>
    <text x="0" y="126" font-family="-apple-system, sans-serif" font-size="36" font-weight="900" fill="#c084fc" letter-spacing="-0.5">
      &amp; Thu Hút Nhân Tài Đẳng Cấp
    </text>

    <!-- Description -->
    <text x="0" y="172" font-family="-apple-system, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Định vị văn hóa doanh nghiệp nổi bật trước hàng triệu ứng viên tiềm năng.
    </text>
    <text x="0" y="196" font-family="-apple-system, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Tối đa hóa tỷ lệ nhận việc (Offer Acceptance Rate) lên đến 92%.
    </text>

    <!-- Highlights -->
    <g transform="translate(0, 230)">
      <g transform="translate(0, 0)">
        <rect width="135" height="50" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="17" font-weight="900" fill="#c084fc">Top 1</text>
        <text x="14" y="40" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Huy hiệu Verified</text>
      </g>
      <g transform="translate(147, 0)">
        <rect width="135" height="50" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="17" font-weight="900" fill="#38bdf8">3.5x</text>
        <text x="14" y="40" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Lượt xem tin đăng</text>
      </g>
      <g transform="translate(294, 0)">
        <rect width="135" height="50" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="17" font-weight="900" fill="#34d399">24/7</text>
        <text x="14" y="40" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Hỗ trợ chiến dịch</text>
      </g>
    </g>
  </g>

  <!-- Right Graphic: Corporate Showcase -->
  <g transform="translate(730, 45)" filter="url(#shadow2)">
    <rect width="390" height="310" rx="20" fill="url(#glassGrad2)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

    <g transform="translate(24, 24)">
      <circle cx="16" cy="16" r="16" fill="#7c3aed" />
      <polygon points="16,8 20,13 26,14 22,18 23,24 16,21 9,24 10,18 6,14 12,13" fill="#ffffff" />
      <text x="42" y="16" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Trang Doanh Nghiệp VIP</text>
      <text x="42" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Quảng bá văn hóa &amp; chế độ</text>
    </g>

    <!-- Company Badge Showcase Card -->
    <g transform="translate(24, 80)">
      <rect width="342" height="95" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18" />
      <circle cx="36" cy="47" r="22" fill="#38bdf8" fill-opacity="0.2" />
      <text x="36" y="53" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#38bdf8">★</text>
      <text x="70" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Tập Đoàn Công Nghệ &amp; Bán Lẻ</text>
      <text x="70" y="58" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Quy mô: 1.000+ nhân sự • Top Employer 2026</text>
      <rect x="70" y="68" width="105" height="18" rx="9" fill="#10b981" fill-opacity="0.25" />
      <text x="122" y="81" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#34d399">✓ ĐÃ XÁC MINH</text>
    </g>

    <!-- Candidate Pipeline Indicator -->
    <g transform="translate(24, 190)">
      <rect width="342" height="95" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18" />
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Tiếp cận ứng viên chủ động</text>
      <text x="320" y="32" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">+340%</text>
      <!-- Progress Bar -->
      <rect x="20" y="46" width="302" height="10" rx="5" fill="#ffffff" fill-opacity="0.15" />
      <rect x="20" y="46" width="260" height="10" rx="5" fill="url(#recBg1)" />
      <text x="20" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
        Hơn 12.000 ứng viên theo dõi trang tuyển dụng
      </text>
    </g>
  </g>
</svg>

