<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="techBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1000" height="380" rx="16" fill="url(#techBg)" />

  <!-- Code grid & matrix pattern -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8">
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="250" y1="0" x2="250" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 50)">
    <!-- Tech Logo -->
    <g transform="translate(0, 0)">
      <rect width="38" height="38" rx="8" fill="#0284c7" />
      <text x="19" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">&lt;/&gt;</text>
      <text x="50" y="27" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#38bdf8" letter-spacing="0.5">FPT &amp; TECH PARTNERS</text>
    </g>

    <text x="0" y="80" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="1">ĐÓN SÓNG CÔNG NGHỆ 2026</text>

    <text x="0" y="125" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      KỸ SƯ PHẦN MỀM FULLSTACK
    </text>
    <text x="0" y="165" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#38bdf8" letter-spacing="-0.5">
      &amp; CLOUD DEVOPS ARCHITECT
    </text>

    <g transform="translate(0, 195)">
      <path d="M12 2 C7.5 2 4 5.5 4 10 C4 16 12 22 12 22 C12 22 20 16 20 10 C20 5.5 16.5 2 12 2 Z M12 12.5 C10.6 12.5 9.5 11.4 9.5 10 C9.5 8.6 10.6 7.5 12 7.5 C13.4 7.5 14.5 8.6 14.5 10 C14.5 11.4 13.4 12.5 12 12.5 Z" fill="#38bdf8" />
      <text x="28" y="16" font-family="-apple-system, sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">
        Hình thức làm việc: <tspan font-weight="700" fill="#ffffff">Hybrid / Remote toàn quốc</tspan>
      </text>
    </g>

    <g transform="translate(0, 235)" filter="url(#glow)">
      <rect width="210" height="46" rx="23" fill="url(#techBtn)" />
      <text x="85" y="29" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a" letter-spacing="0.5">ỨNG TUYỂN NGAY</text>
      <circle cx="180" cy="23" r="12" fill="#0f172a" fill-opacity="0.2" />
      <polygon points="178,18 185,23 178,28" fill="#0f172a" />
    </g>
  </g>

  <!-- Right Visuals: Modern Tech terminal & Robot Mascot -->
  <g transform="translate(620, 45)">
    <!-- Tech Terminal Glass Card -->
    <rect x="50" y="30" width="280" height="230" rx="14" fill="#030712" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="75" cy="52" r="5" fill="#ef4444" />
    <circle cx="92" cy="52" r="5" fill="#f59e0b" />
    <circle cx="109" cy="52" r="5" fill="#10b981" />

    <text x="75" y="85" font-family="monospace" font-size="13" fill="#38bdf8">const future = await apply();</text>
    <text x="75" y="110" font-family="monospace" font-size="13" fill="#10b981">success: true, offer: "Top Tier"</text>
    <text x="75" y="135" font-family="monospace" font-size="13" fill="#f59e0b">stack: ["React", "Go", "Docker"]</text>
    <text x="75" y="160" font-family="monospace" font-size="13" fill="#94a3b8">salary: "$1,500 - $3,000 / mo"</text>
    
    <!-- Neon badges -->
    <rect x="75" y="185" width="85" height="24" rx="12" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <text x="117" y="201" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Sign-on Bonus</text>

    <!-- Dev Robot Mascot -->
    <g transform="translate(0, 60)">
      <rect x="0" y="20" width="85" height="70" rx="20" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" />
      <line x1="42" y1="20" x2="42" y2="4" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
      <circle cx="42" cy="4" r="6" fill="#38bdf8" />
      <!-- Visor -->
      <rect x="12" y="35" width="60" height="32" rx="12" fill="#0f172a" />
      <circle cx="28" cy="51" r="5" fill="#38bdf8" />
      <circle cx="56" cy="51" r="5" fill="#38bdf8" />
      <!-- Body -->
      <rect x="8" y="96" width="70" height="75" rx="16" fill="#e2e8f0" stroke="#38bdf8" stroke-width="2" />
      <circle cx="43" cy="130" r="14" fill="#0284c7" />
      <path d="M37 130 L43 124 L49 130" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>

